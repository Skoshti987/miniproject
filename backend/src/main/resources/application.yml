server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: krishsathi-backend
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  cache:
    type: simple
    cache-names:
      - queries
      - weather
      - advisories
  
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

logging:
  level:
    com.krishsathi: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Custom application properties
krishsathi:
  ml:
    model-path: /models
    confidence-threshold: 0.7
  weather:
    api-key: ${WEATHER_API_KEY:demo-key}
    base-url: https://api.openweathermap.org/data/2.5
  escalation:
    enabled: true
    officer-email: officer@krishibhavan.kerala.gov.in
    sms-gateway: https://api.sms-gateway.com

# Firebase Configuration
firebase:
  project-id: ${FIREBASE_PROJECT_ID:your_project_id_here}
  admin-sdk-path: ${FIREBASE_ADMIN_SDK_PATH:./firebase-admin-key.json}
  database-url: ${FIREBASE_DATABASE_URL:https://your_project_id-default-rtdb.firebaseio.com/}
  storage-bucket: ${FIREBASE_STORAGE_BUCKET:your_project_id.appspot.com}
